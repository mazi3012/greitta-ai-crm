<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greitta AI - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .tma-card {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(31, 41, 55, 0.8);
    }
  </style>
</head>
<body class="p-4">
  <div class="max-w-md mx-auto space-y-5 pt-4">
    <!-- Header -->
    <div class="text-center space-y-1">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-600 via-mint-500 to-green-600 flex items-center justify-center text-white text-2xl font-black shadow-lg">
        ⚡
      </div>
      <h1 class="text-xl font-extrabold tracking-tight text-emerald-400">
        Greitta AI Lead Checker
      </h1>
      <p class="text-xs text-gray-400">Telegram Mini App Sync</p>
    </div>

    <!-- Quick Check Form -->
    <div class="tma-card p-5 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-sm font-bold text-gray-200">Check or Claim Lead Status</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Instagram Handle</label>
          <input
            id="ig_handle"
            type="text"
            placeholder="@handle..."
            class="w-full px-3.5 py-2.5 text-sm bg-gray-900 border border-gray-800 rounded-xl focus:outline-none focus:border-emerald-500 text-white"
          />
        </div>
        <button
          onclick="checkLead()"
          class="w-full py-3 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold text-sm rounded-xl transition-all shadow-md active:scale-95"
        >
          Verify Lead Availability
        </button>
      </div>

      <div id="result" class="hidden p-3 rounded-xl text-xs font-semibold"></div>
    </div>

    <!-- Footer -->
    <div class="text-center text-[11px] text-gray-500">
      Connected to Greitta AI Telegram Mini App Runtime
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    async function checkLead() {
      const handle = document.getElementById('ig_handle').value.trim();
      const resBox = document.getElementById('result');
      if (!handle) {
        alert('Please enter an Instagram handle');
        return;
      }

      resBox.className = 'p-3 rounded-xl text-xs font-semibold bg-gray-800 text-gray-300';
      resBox.innerText = 'Checking lead status...';
      resBox.classList.remove('hidden');

      try {
        const res = await fetch('/api/check-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ig_handle: handle })
        });
        const data = await res.json();

        if (data.available) {
          resBox.className = 'p-3 rounded-xl text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          resBox.innerText = `✅ Lead ${handle} is AVAILABLE for claiming!`;
        } else {
          resBox.className = 'p-3 rounded-xl text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30';
          resBox.innerText = `❌ Lead claimed by ${data.claimed_by_name || 'another agent'}`;
        }
      } catch (err) {
        resBox.className = 'p-3 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30';
        resBox.innerText = '⚡ Lead is available (Demo Mode active)';
      }
    }
  </script>
</body>
</html>
